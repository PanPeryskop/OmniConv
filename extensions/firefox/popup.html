<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
    <header class="top">
        <div class="brand">
            <span class="logo" data-icon="download" data-size="15"></span>
            <span>OmniConv</span>
        </div>
        <button class="status checking" id="status" type="button" data-i18n-title="statusRecheck">
            <span class="dot"></span>
            <span id="statusText" data-i18n="statusChecking"></span>
        </button>
        <div class="spacer"></div>
        <button class="icon-btn" id="openApp" type="button" data-i18n-title="btnOpenApp"><span data-icon="external"></span></button>
        <button class="icon-btn" id="openSettings" type="button" data-i18n-title="btnSettings"><span data-icon="sliders"></span></button>
    </header>

    <nav class="tabs" role="tablist">
        <button class="tab" type="button" data-tab="media"><span data-icon="film" data-size="14"></span><span data-i18n="tabMedia"></span></button>
        <button class="tab" type="button" data-tab="file" hidden><span data-icon="convert" data-size="14"></span><span data-i18n="tabFile"></span></button>
        <button class="tab" type="button" data-tab="queue"><span data-icon="queue" data-size="14"></span><span data-i18n="tabQueue"></span><span class="count" id="queueCount" hidden></span></button>
    </nav>

    <main>
        <section class="view" id="view-media" hidden>
            <div class="empty" id="mediaEmpty" hidden>
                <div class="big-icon" data-icon="globe" data-size="24"></div>
                <h3 data-i18n="emptyNoPageTitle"></h3>
                <p data-i18n="emptyNoPageText"></p>
            </div>

            <div class="empty offline" id="mediaOffline" hidden>
                <div class="big-icon" data-icon="offline" data-size="24"></div>
                <h3 data-i18n="offlineTitle"></h3>
                <p><span data-i18n="offlineText"></span> <code id="offlineUrl"></code></p>
                <div class="row">
                    <button class="btn primary small" id="offlineRetry" type="button"><span data-icon="retry" data-size="14"></span><span data-i18n="btnRetry"></span></button>
                    <button class="btn small" id="offlineSettings" type="button"><span data-icon="sliders" data-size="14"></span><span data-i18n="btnSettings"></span></button>
                </div>
            </div>

            <div class="view" id="mediaMain" hidden>
                <div class="segmented" id="ytSwitch" hidden>
                    <button type="button" data-mode="video" data-i18n="segVideo"></button>
                    <button type="button" data-mode="playlist" data-i18n="segPlaylist"></button>
                </div>

                <article class="card" id="mediaCard">
                    <div class="thumb" id="thumb">
                        <img id="thumbImg" alt="">
                        <div class="no-thumb" id="noThumb" hidden><span data-icon="film" data-size="28"></span></div>
                        <span class="platform" id="platformBadge" hidden></span>
                        <span class="badge" id="durationBadge" hidden></span>
                    </div>
                    <div class="meta">
                        <div class="title" id="mediaTitle"></div>
                        <div class="sub" id="mediaSub"></div>
                    </div>
                </article>

                <div class="playlist" id="playlistBox" hidden>
                    <div class="pl-head"><span data-icon="list" data-size="14"></span><span id="plHead"></span></div>
                    <ol id="plList"></ol>
                </div>

                <div class="notice error" id="infoError" hidden>
                    <span data-icon="alert" data-size="15"></span>
                    <span class="grow" id="infoErrorText"></span>
                    <button class="link" id="infoRetry" type="button" data-i18n="btnRetry"></button>
                </div>

                <div class="section-label" data-i18n="lblQuality"></div>
                <div class="chips" id="formatChips"></div>

                <button class="btn primary big" id="downloadBtn" type="button">
                    <span data-icon="download"></span>
                    <span id="downloadLabel"></span>
                </button>
                <div class="hint" id="shortcutHint" hidden></div>
            </div>
        </section>

        <section class="view" id="view-file" hidden>
            <article class="card file-card">
                <div class="file-icon" id="fileIcon"></div>
                <div class="meta">
                    <div class="title" id="fileName"></div>
                    <div class="sub" id="fileType"></div>
                </div>
            </article>
            <div class="section-label" data-i18n="lblConvertTo"></div>
            <div class="chips" id="targetChips"></div>
            <button class="btn primary big" id="convertBtn" type="button">
                <span data-icon="convert"></span>
                <span id="convertLabel"></span>
            </button>
            <button class="btn big" id="ocrBtn" type="button" hidden>
                <span data-icon="text"></span>
                <span data-i18n="btnOcr"></span>
            </button>
        </section>

        <section class="view" id="view-queue" hidden>
            <div class="queue-head">
                <span id="queueSummary"></span>
                <button class="link" id="clearFinished" type="button" data-i18n="btnClearFinished"></button>
            </div>
            <div class="queue" id="queueList"></div>
            <div class="empty" id="queueEmpty" hidden>
                <div class="big-icon" data-icon="inbox" data-size="24"></div>
                <h3 data-i18n="emptyQueueTitle"></h3>
                <p data-i18n="emptyQueueText"></p>
            </div>
        </section>
    </main>

    <script src="shared.js"></script>
    <script src="ui.js"></script>
    <script src="popup.js"></script>
</body>
</html>
