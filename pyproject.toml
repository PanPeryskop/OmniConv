[project]
name = "omniconv"
version = "1.0.0"
description = "Local file converter, media downloader and PDF toolkit with a web UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.2",
    "flask-cors==6.0.2",
    "Flask-SocketIO==5.6.0",
    "simple-websocket==1.1.0",
    "requests==2.32.5",
    "PyMuPDF==1.27.1",
    "pdf2docx==0.5.9",
    "pdfplumber==0.11.9",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "EbookLib==0.20",
    "Markdown==3.11.2",
    "rapidocr==3.10.0",
    "onnxruntime==1.24.1",
    "pillow==11.3.0",
    "pillow_heif==1.2.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "moviepy==2.2.1",
    "yt-dlp[default]>=2026.10.26",
    "spotdl==4.5.0",
    "brotli==1.2.0",
    "pystray==0.19.5",
    "fonttools==4.68.0",
    "uharfbuzz==0.51.1",
    "pyhanko==0.29.1",
]

[project.optional-dependencies]
gpu = [
    "paddlepaddle-gpu==3.4.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12==12.9.37; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.9.0.52; sys_platform == 'win32'",
    "nvidia-cublas-cu12==12.9.0.13; sys_platform == 'win32'",
    "nvidia-cufft-cu12==11.4.0.6; sys_platform == 'win32'",
    "nvidia-curand-cu12==10.3.10.19; sys_platform == 'win32'",
    "nvidia-cusolver-cu12==11.7.4.40; sys_platform == 'win32'",
    "nvidia-cusparse-cu12==12.5.9.5; sys_platform == 'win32'",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129" }
