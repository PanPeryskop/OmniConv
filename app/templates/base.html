<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OmniConv: convert, compress and download files on your own computer">
    <title{% block title_i18n %}{% endblock %}>{% block title %}OmniConv{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.js" integrity="sha512-tE1z+95+lMCGwy+9PnKgUSIeHhvioC9lMlI7rLWU0Ps3XTdjRygLcy4mLuL0JAoK4TLdQEyP0yOl/9dMOqpH/Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>html.i18n-pending body { visibility: hidden; }</style>
    <script>
        (function() {
            var root = document.documentElement;
            try {
                var savedTheme = localStorage.getItem('theme-preference');
                if (savedTheme) root.setAttribute('data-theme', savedTheme);
            } catch (e) {}
            var lang = null;
            try { lang = localStorage.getItem('lang'); } catch (e) {}
            if (!lang) lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
            if (lang === 'pl' || lang === 'de') {
                root.lang = lang;
                root.classList.add('i18n-pending');
                setTimeout(function() { root.classList.remove('i18n-pending'); }, 1500);
            }
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
            });
        }
    </script>
</head>
<body>
    <div class="app-wrapper">
        <nav class="nav-header">
            <a href="/" class="brand-link">
                <div class="brand-icon" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4">
                        <path d="M10.5 16.5l4 4 7.5-8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="brand-name">OmniConv</span>
            </a>
            <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu" data-i18n-aria="menu_toggle" aria-expanded="false" aria-controls="navMenu" onclick="toggleNav()">
                <svg class="hamburger-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="4" y1="7" x2="20" y2="7"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="17" x2="20" y2="17"></line>
                </svg>
                <svg class="hamburger-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                </svg>
            </button>
            <div class="nav-controls" id="navMenu">
                <div class="nav-links">
                    <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                        </svg>
                        <span data-i18n="convert_btn">Convert</span>
                    </a>
                    <a href="/youtube" class="nav-link {% if request.path == '/youtube' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path>
                            <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
                        </svg>
                        <span data-i18n="youtube_btn">Web Video</span>
                    </a>
                    <a href="/batch" class="nav-link {% if request.path == '/batch' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                        </svg>
                        <span data-i18n="batch_btn">Batch</span>
                    </a>
                    <a href="/compress" class="nav-link {% if request.path == '/compress' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <polyline points="4 14 10 14 10 20"/>
                            <polyline points="20 10 14 10 14 4"/>
                            <line x1="14" y1="10" x2="21" y2="3"/>
                            <line x1="3" y1="21" x2="10" y2="14"/>
                        </svg>
                        <span data-i18n="compress_btn">Compress</span>
                    </a>
                    <a href="/pdf" class="nav-link {% if request.path == '/pdf' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                            <path d="M14 2v6h6"/>
                            <path d="M9 15h6M12 12v6"/>
                        </svg>
                        <span data-i18n="pdf_btn">PDF</span>
                    </a>
                    <a href="/about" class="nav-link {% if request.path == '/about' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 16v-4M12 8h.01"/>
                        </svg>
                        <span data-i18n="formats_btn">Formats</span>
                    </a>
                    <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="7" height="9"/>
                            <rect x="14" y="3" width="7" height="5"/>
                            <rect x="14" y="12" width="7" height="9"/>
                            <rect x="3" y="16" width="7" height="5"/>
                        </svg>
                        <span data-i18n="stats_btn">Stats</span>
                    </a>
                </div>
                <div class="nav-tools">
                    <div class="lang-switch" role="group" aria-label="Language" data-i18n-aria="language">
                        <button type="button" data-lang="en" onclick="setLanguage('en')">EN</button>
                        <button type="button" data-lang="pl" onclick="setLanguage('pl')">PL</button>
                        <button type="button" data-lang="de" onclick="setLanguage('de')">DE</button>
                    </div>
                    <a href="/settings" class="theme-switch {% if request.path == '/settings' %}active{% endif %}" aria-label="Settings" title="Settings" data-i18n-aria="settings_btn" data-i18n-title="settings_btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                        </svg>
                    </a>
                    <button class="theme-switch" id="themeToggle" aria-label="Toggle theme" data-i18n-aria="theme_toggle">
                        <svg class="icon icon-light" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="5"/>
                            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke-linecap="round"/>
                        </svg>
                        <svg class="icon icon-dark" viewBox="0 0 24 24">
                            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                        </svg>
                    </button>
                    <button class="theme-switch" id="mobileConnectBtn" onclick="toggleMobileModal()" aria-label="Connect Mobile" data-i18n-aria="connect_mobile" data-i18n-title="connect_mobile" title="Connect Mobile">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                            <line x1="12" y1="18" x2="12" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </nav>
        <div class="nav-backdrop" id="navBackdrop" onclick="toggleNav(false)"></div>
        
        <div id="mobileModal" class="modal-overlay hidden" role="dialog" aria-label="Connect Mobile" data-i18n-aria="connect_mobile">
            <div class="modal-dialog">
                <button class="modal-close" onclick="toggleMobileModal()" aria-label="Close" data-i18n-aria="close">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
                <h2 class="modal-title" data-i18n="connect_mobile">Connect Mobile</h2>
                <p class="modal-subtitle" data-i18n="connect_mobile_desc">Scan to open OmniConv on your phone</p>
                <div id="qrcode" class="qr-container"></div>
                <div class="modal-url-box">
                    <p class="modal-url-label" data-i18n="or_visit">OR VISIT</p>
                    <code class="modal-url-value">http://{{ local_ip }}:5000</code>
                </div>
            </div>
        </div>
        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <script>
            function toggleNav(force) {
                const nav = document.getElementById('navMenu');
                const btn = document.getElementById('hamburgerBtn');
                const open = typeof force === 'boolean' ? force : !nav.classList.contains('active');
                nav.classList.toggle('active', open);
                document.body.classList.toggle('nav-open', open);
                btn.setAttribute('aria-expanded', open);
            }
            document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleNav(false); });
            window.matchMedia('(min-width: 1280px)').addEventListener('change', e => { if (e.matches) toggleNav(false); });
            
            function toggleMobileModal() {
                const modal = document.getElementById('mobileModal');
                if (modal.classList.contains('hidden')) {
                    modal.classList.remove('hidden');
                    modal.style.display = 'flex';
                    
                    const qr = document.getElementById('qrcode');
                    if (!qr.innerHTML) {
                        new QRCode(qr, {
                            text: "http://{{ local_ip }}:5000",
                            width: 180,
                            height: 180
                        });
                    }
                } else {
                    modal.classList.add('hidden');
                    modal.style.display = 'none';
                }
            }
            document.getElementById('mobileModal').classList.add('hidden');
            document.getElementById('mobileModal').style.display = 'none';
        </script>
        
        <main class="main-container">
            {% block content %}{% endblock %}
        </main>
        
        <div class="toast-container" id="toastContainer" aria-live="polite"></div>
    </div>
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script src="{{ url_for('static', filename='js/stats.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jobs.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
