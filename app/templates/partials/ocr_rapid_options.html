<div class="ocr-rapid-options" data-ocr-rapid>
    <label class="ocr-rapid-field">
        <span class="ocr-rapid-label" data-i18n="ocr_quality">Accuracy</span>
        <select class="{{ select_class }}" data-ocr-quality aria-label="Accuracy" data-i18n-aria="ocr_quality">
            <option value="accurate" data-i18n="ocr_quality_accurate">Accurate (recommended)</option>
            <option value="standard" data-i18n="ocr_quality_standard">Standard</option>
            <option value="fast" data-i18n="ocr_quality_fast">Fast</option>
        </select>
    </label>
    <label class="ocr-rapid-field">
        <span class="ocr-rapid-label" data-i18n="ocr_script">Alphabet</span>
        <select class="{{ select_class }}" data-ocr-script aria-label="Alphabet" data-i18n-aria="ocr_script">
            <option value="latin" data-i18n="ocr_script_latin">Latin, Chinese, Japanese</option>
            <option value="eslav" data-i18n="ocr_script_eslav">Cyrillic: Russian, Ukrainian, Belarusian</option>
            <option value="cyrillic" data-i18n="ocr_script_cyrillic">Cyrillic: Bulgarian, Serbian and others</option>
            <option value="el" data-i18n="ocr_script_el">Greek</option>
            <option value="arabic" data-i18n="ocr_script_arabic">Arabic, Persian, Urdu</option>
            <option value="korean" data-i18n="ocr_script_korean">Korean</option>
            <option value="th" data-i18n="ocr_script_th">Thai</option>
            <option value="devanagari" data-i18n="ocr_script_devanagari">Hindi, Marathi, Nepali</option>
            <option value="ta" data-i18n="ocr_script_ta">Tamil</option>
            <option value="te" data-i18n="ocr_script_te">Telugu</option>
        </select>
    </label>
    <p class="{{ hint_class }}" data-ocr-rapid-hint></p>
</div>
